name: Publish npm package

on:
  push:
    branches:
      - main
    tags:
      - '*-release'
  workflow_dispatch:
    inputs:
      channel:
        description: Publish a prerelease or a stable release
        type: choice
        required: true
        default: prerelease
        options:
          - prerelease
          - release
      version:
        description: Stable version for release (for example, 1.5.0); leave blank for prerelease
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: |
          npm install --global npm@11
          npm --version

      - name: Verify publish source
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual publishes must run from main." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git fetch origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "Release tags must point to a commit on main." >&2
              exit 1
            fi
          fi

      - name: Set package version and npm tag
        id: version
        shell: bash
        env:
          PUBLISH_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-release$ ]]; then
              echo "Expected a tag like 1.5.0-release." >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME%-release}"
            dist_tag=latest
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$PUBLISH_CHANNEL" == "release" ]]; then
            if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Manual releases require a version like 1.5.0." >&2
              exit 1
            fi
            version="$RELEASE_VERSION"
            dist_tag=latest
          else
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$PUBLISH_CHANNEL" != "prerelease" ]]; then
              echo "Choose release or prerelease." >&2
              exit 1
            fi
            base="$(node -p "require('./package.json').version.split('-')[0]")"
            if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "package.json must have a numeric major.minor.patch base version." >&2
              exit 1
            fi
            version="${base}-beta.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            dist_tag=beta
          fi
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Check and build
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Pack package
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          tarball="release/$(npm pack --pack-destination release --silent)"
          tar -tzf "$tarball" > release/contents.txt
          for required in package/README.md package/LICENSE package/dist/index.js package/dist/edgeweft.css package/assets/dependency-graph-3d.jpg; do
            if ! grep -Fxq "$required" release/contents.txt; then
              echo "Package is missing $required." >&2
              exit 1
            fi
          done
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        shell: bash
        run: |
          set -euo pipefail
          npm publish "./$TARBALL" --access public --tag "$DIST_TAG" --provenance --loglevel verbose
